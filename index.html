<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <title>CDaLoong</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta name="baidu-site-verification" content="codeva-VBBBn6hyor" />
    <!-- <link rel="icon" href="./c.png" /> -->
    <link rel="icon" href="https://ssl-pubpic.51yund.com/1433690764.png" />
    <link rel="stylesheet" href="./Static/themes/vue.min.css" />
    <link rel="stylesheet" href="./Static/themes/gitalk.css" />
    <link rel="stylesheet" href="./Static/themes/dark.css" />
  </head>

  <body>
    <!-- 主题切换按钮 -->
    <button id="theme-toggle" title="切换主题">
      <svg id="sun-icon" viewBox="0 0 24 24">
        <path d="M12 18c-3.3 0-6-2.7-6-6s2.7-6 6-6 6 2.7 6 6-2.7 6-6 6zm0-10c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4z"/>
        <path d="M12 4V2m0 20v-2m8-8h2M2 12h2m15.36-5.64l1.41-1.41M3.64 19.36l1.41-1.41m0-12.73L3.64 4.22m15.36 15.36l-1.41-1.41"/>
      </svg>
      <svg id="moon-icon" viewBox="0 0 24 24" style="display: none;">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
      </svg>
    </button>
    
    <div id="app">Please wait...</div>
    <script>
      window.$docsify = {
        name: "CDaLoong", // 文档标题，会显示在侧边栏顶部
        repo: "https://github.com/CDaLoong", // 配置仓库地址或者 username/repo 的字符串，会在页面右上角渲染一个 GitHub Corner 挂件
        loadSidebar: true, // 加载自定义侧边栏，设置为 true 后会加载 _sidebar.md 文件，也可以自定义加载的文件名。
        subMaxLevel: 3, // 副标题层级
        sidebarDisplayLevel: 0, // 设置侧边栏显示级别 0 为都不展开
        auto2top: true, // 切换页面后是否自动跳转到页面顶部。
        themeColor: "#4C98F7", // 替换主题色。利用 CSS3 支持变量的特性，对于老的浏览器有 polyfill 处理。
        // logo: "./CDaLoong-logo.png", // 在侧边栏中出现的网站图标，可以使用CSS来更改大小
        logo: "https://ssl-pubpic.51yund.com/1433690780.png",
        search: {
          paths: "auto",
          placeholder: "Type to search",
          noData: "No Results",
          depth: 3, // 搜索标题的最大层级
        },
        // 定义路由别名，可以更自由的定义路由规则。 支持正则。
        alias: {
          "/.*/_sidebar.md": "/_sidebar.md",
        },
        plugins: [],
        // 设置请求资源的请求头。
        requestHeaders: {},
        count: {
          position: "bottom",
        },
      };
    </script>
    <script src="./Static/docsify.min.js"></script>
    <script src="./Static/plugins/catalog.js"></script>
    <script src="./Static/plugins/search.min.js"></script>
    <script src="./Static/plugins/zoom-image.min.js"></script>
    <script src="./Static/plugins/docsify-copy-code.min.js"></script>
    <script src="./Static/plugins/docsify-pagination.min.js"></script>
    <script src="./Static/plugins/countable.js"></script>
    <script src="./Static/plugins/front-matter.min.js"></script>
    <script src="./Static/plugins/emoji.min.js"></script>
    <script src="./Static/plugins/docsify-sidebar-collapse.min.js"></script>
    <script src="./Static/plugins/gitalk.min.js"></script>
    <script src="./Static/plugins/blueimp-md5@2.19.0.js"></script>

    <script>
      window.$docsify.plugins = [].concat((hook, vm) => {
        const dom = Docsify.dom;
        hook.mounted(() => {
          const div = dom.create("div");
          div.id = "git-talks-container";
          const main = dom.getNode("#main");
          div.style =
            "width: " +
            main.clientWidth +
            "px; margin: 0 auto 20px;padding-bottom: 50px;";
          dom.appendTo(dom.find(".content"), div);
        });
        hook.doneEach(() => {
          let title = decodeURIComponent(
            vm.route.path.split("/").slice(-1).pop()
          );
          if (!title) title = window.$docsify.name;
          document.title = title;
          for (
            let n = document.getElementById("git-talks-container");
            n.hasChildNodes();

          )
            n.removeChild(n.firstChild);
          new Gitalk({
            clientID: "d4c819cbca9ab620ca32",
            clientSecret: "43fd4923d0bbab8fd2398a8d8d5c1024093bfe7a",
            repo: "git-talks",
            owner: "CDaLoong",
            title: title,
            body: `[${title}](${location.href})`,
            admin: ["CDaLoong"],
            id: md5("blog" + title),
            distractionFreeMode: false,
          }).render("git-talks-container");
        });
      }, $docsify.plugins);
    </script>

    <!-- 主题切换功能 -->
    <script>
      (function() {
        // 获取本地存储的主题设置
        const currentTheme = localStorage.getItem('theme') || 'light';
        const themeToggle = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        
        // 应用主题
        function applyTheme(theme) {
          document.body.setAttribute('data-theme', theme);
          localStorage.setItem('theme', theme);
          
          if (theme === 'dark') {
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
          } else {
            sunIcon.style.display = 'block';
            moonIcon.style.display = 'none';
          }
        }
        
        // 切换主题
        function toggleTheme() {
          const current = document.body.getAttribute('data-theme') || 'light';
          const newTheme = current === 'light' ? 'dark' : 'light';
          applyTheme(newTheme);
        }
        
        // 初始化主题
        applyTheme(currentTheme);
        
        // 绑定点击事件
        themeToggle.addEventListener('click', toggleTheme);
        
        // 监听系统主题变化（可选）
        if (window.matchMedia) {
          const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
          mediaQuery.addListener(function(e) {
            if (!localStorage.getItem('theme')) {
              applyTheme(e.matches ? 'dark' : 'light');
            }
          });
        }
      })();
    </script>
  </body>
</html>
